<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>空白網頁</title>
    <style>
        .today {
            background: #c8f7c5 !important;
            color: #1a3d1a;
            font-weight: bold;
            box-shadow: 0 0 0 2px #7be495 inset;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif;
            background: #f6f8fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 40px;
            color: #2d3a4b;
            letter-spacing: 2px;
        }

        table {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin: 32px 0 0 0;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
        }

        th,
        td {
            width: 48px;
            height: 48px;
            text-align: center;
            font-size: 1.1em;
        }

        thead th {
            background: #4f8cff;
            color: #fff;
            font-weight: bold;
            border-bottom: 2px solid #e0e7ef;
        }

        tbody td {
            background: #f9fbfd;
            color: #2d3a4b;
            border-bottom: 1px solid #e0e7ef;
            border-right: 1px solid #e0e7ef;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody td:last-child,
        thead th:last-child {
            border-right: none;
        }

        tbody td:not(:empty):hover {
            background: #e6f0ff;
            cursor: pointer;
            transition: background 0.2s;
        }
    </style>
</head>

</body>
<h1>2026 年 5 月行事曆</h1>
<table id="calendar" border="1" cellspacing="0" cellpadding="8" style="border-collapse: collapse; text-align: center;">
    <thead>
        <tr>
            <th>日</th>
            <th>一</th>
            <th>二</th>
            <th>三</th>
            <th>四</th>
            <th>五</th>
            <th>六</th>
        </tr>
    </thead>
    <tbody>
        <!-- JavaScript 產生內容 -->
    </tbody>
</table>
<script>
    function generateCalendar(year, month) {
        const tbody = document.querySelector('#calendar tbody');
        tbody.innerHTML = '';
        const firstDay = new Date(year, month - 1, 1);
        const lastDay = new Date(year, month, 0);
        let startDay = firstDay.getDay();
        let totalDays = lastDay.getDate();
        let row = document.createElement('tr');
        // 今日日期
        const today = new Date();
        const isThisMonth = (today.getFullYear() === year && (today.getMonth() + 1) === month);
        // 填入空白
        for (let i = 0; i < startDay; i++) {
            row.appendChild(document.createElement('td'));
        }
        for (let date = 1; date <= totalDays; date++) {
            if ((row.children.length) === 7) {
                tbody.appendChild(row);
                row = document.createElement('tr');
            }
            const td = document.createElement('td');
            td.textContent = date;
            // 標記今日
            if (isThisMonth && date === today.getDate()) {
                td.classList.add('today');
            }
            row.appendChild(td);
        }
        // 填滿最後一列
        while (row.children.length < 7) {
            row.appendChild(document.createElement('td'));
        }
        tbody.appendChild(row);
    }
    // 產生 2026 年 5 月行事曆
    generateCalendar(2026, 5);
</script>
</body>
</body>

</html>
