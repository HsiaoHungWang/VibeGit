<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六月行事曆</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
        }

        .calendar {
            width: 350px;
            margin: 40px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .calendar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 8px 6px;
            /* 水平8px 垂直6px 的格子間距 */
        }

        th,
        td {
            width: 14.28%;
            height: 40px;
            text-align: center;
            border-radius: 5px;
        }

        th {
            background: #e9ecef;
            color: #495057;
        }

        td {
            background: #f8f9fa;
        }

        td.today {
            background: #ffe066;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="calendar">
        <h2>2026 年 6 月</h2>
        <table>
            <thead>
                <tr>
                    <th>日</th>
                    <th>一</th>
                    <th>二</th>
                    <th>三</th>
                    <th>四</th>
                    <th>五</th>
                    <th>六</th>
                </tr>
            </thead>
            <tbody id="calendar-body">
                <!-- 行事曆內容將由 JavaScript 產生 -->
            </tbody>
        </table>
    </div>
    <script>
        function generateJune2026Calendar() {
            const firstDay = new Date(2026, 5, 1).getDay(); // 0=Sunday
            const daysInMonth = 30;
            let html = '';
            let day = 1;
            for (let i = 0; i < 6; i++) { // 最多6週
                html += '<tr>';
                for (let j = 0; j < 7; j++) {
                    if (i === 0 && j < firstDay) {
                        html += '<td></td>';
                    } else if (day > daysInMonth) {
                        html += '<td></td>';
                    } else {
                        html += `<td${day === 26 ? ' class="today"' : ''}>${day}</td>`;
                        day++;
                    }
                }
                html += '</tr>';
                if (day > daysInMonth) break;
            }
            document.getElementById('calendar-body').innerHTML = html;
        }
        generateJune2026Calendar();
    </script>
</body>

</html>
